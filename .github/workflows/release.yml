name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # npm pack runs the prepack build too, so the tarball always carries a
      # fresh web/dist. The release asset gets a stable name the installer
      # fetches from .../releases/latest/download/hermit.tgz.
      - name: Pack
        run: |
          npm pack
          cp hermit-console-*.tgz hermit.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: hermit.tgz
          generate_release_notes: true

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
